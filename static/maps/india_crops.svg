<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 612 696" width="100%" height="100%">
    <defs>
        <style>
            .ocean { fill: #bae6fd; }
            .land { fill: #fef08a; stroke: #475569; stroke-width: 1.2; }
            .soil-alluvial { fill: #bbf7d0; fill-opacity: 0.8; }
            .soil-black { fill: #cbd5e1; fill-opacity: 0.8; }
            .soil-red { fill: #fecdd3; fill-opacity: 0.8; }
            .soil-laterite { fill: #fed7aa; fill-opacity: 0.8; }
            .label-soil { font-family: sans-serif; font-size: 11px; font-weight: bold; fill: #0f172a; }
            .title { font-family: sans-serif; font-size: 14px; font-weight: 800; fill: #0f172a; }
        </style>
    </defs>
    <rect width="612" height="696" class="ocean"/>
    <path class="land" d="M 230 40 L 290 85 L 350 110 L 375 140 L 460 170 L 530 160 L 580 200 L 550 250 L 480 260 L 450 310 L 430 390 L 380 490 L 320 620 L 290 620 L 250 510 L 190 410 L 170 330 L 140 310 L 180 250 L 200 180 Z"/>

    <text x="170" y="40" class="title">MAJOR SOIL TYPES &amp; AGRICULTURE</text>

    <!-- Alluvial Soil (Wheat/Rice Belt) -->
    <path class="soil-alluvial" d="M 200 190 Q 320 220 480 260 L 470 310 Q 310 250 190 220 Z"/>
    <text x="260" y="240" class="label-soil">Alluvial Soil (Wheat &amp; Rice)</text>

    <!-- Black Soil (Regur / Cotton Belt) -->
    <ellipse cx="280" cy="380" rx="65" ry="45" class="soil-black"/>
    <text x="235" y="380" class="label-soil">Black Soil (Cotton)</text>

    <!-- Red & Yellow Soil -->
    <ellipse cx="370" cy="460" rx="55" ry="60" class="soil-red"/>
    <text x="330" y="460" class="label-soil">Red &amp; Yellow Soil</text>

    <!-- Tea Plantations (Assam) -->
    <ellipse cx="530" cy="200" rx="30" ry="20" class="soil-laterite"/>
    <text x="515" y="205" class="label-soil">Tea Belt</text>
</svg>